<div id="callbackPopup" aria-hidden="true" class="popup callbackPopup">
	<div class="popup__wrapper">
		<div class="popup__content callbackPopup__content">
      <div class="popup__dragclose" data-dragclose=""></div>
			<button data-close type="button" class="popup__close"></button>
      <div class="popup__body callbackPopup__body">
        <div class="callbackPopup__title">Дайте нам знать — и мы предложим лучшее</div>
        <form action="#" class="callbackPopup__form prefooter__form form">
          <div class="prefooter__row">
            <label class="prefooter__item form__item">
              <input type="text" class="prefooter__input form__input" data-required placeholder="Ваше имя*">
            </label>
            <label class="prefooter__item form__item">
              <input 
                type="text" 
                class="prefooter__input form__input" 
                data-required="phone"
                placeholder="Ваш телефон*"
                data-inputmask="'mask': '+7 (999) 999-99-99'"
              >
            </label>
          </div>
          <div class="prefooter__row">
            <label class="prefooter__item form__item">
              <input type="text" class="prefooter__input form__input" placeholder="Ваше сообщение">
            </label>
          </div>
          <div class="prefooter__row">
            <button type="submit" class="prefooter__button btn btn-blue">Оставить заявку</button>
          </div>
          <div class="prefooter__row">
            <label class="prefooter__boxwrap form__boxwrap">
              <input type="checkbox" data-required>
              <i></i>
              <span>
                Я принимаю <a href="#">условия конфиденциальности</a> и даю <a href="#">согласие на обработку моих персональных данных</a>
              </span>
            </label>
          </div>
        </form>
        <div class="callbackPopup__info">
          <p>Работаем пн-пт с 9:00 до 18:00 по Мск</p>
          <p>Свяжемся с вами в течение часа</p>
        </div>
      </div>
		</div>
	</div>
</div>
